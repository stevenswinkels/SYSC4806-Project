spring:
  mail:
    username: ${spring_mail_username:user}
    password: ${spring_mail_password:password}
    host: ${spring_mail_host:localhost}
    port: ${spring_mail_port:8025}
    protocol: smtp
    test-connection: false
    tls: ${spring_mail_enable_tls:false}
    properties.mail.smtp:
      auth: ${spring_mail_enable_tls:false}
      starttls.enable: ${spring_mail_enable_tls:false}
      ssl.trust: ${spring_mail_host:localhost}
custom:
  mail:
    from: ${custom_mail_address:noreply@example.com}