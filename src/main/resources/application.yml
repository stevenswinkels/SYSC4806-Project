spring:
  mail:
    username: ${spring-mail-username}
    password: ${spring-mail-password}
    host: ${spring-mail-host}
    port: ${spring-mail-port}
    protocol: smtp
    test-connection: false
    tls: ${spring-mail-enable-tls}
    properties.mail.smtp:
      auth: ${spring-mail-enable-tls}
      starttls.enable: ${spring-mail-enable-tls}
      ssl.trust: ${spring-mail-host}
custom:
  mail:
    from: ${custom-mail-address}

