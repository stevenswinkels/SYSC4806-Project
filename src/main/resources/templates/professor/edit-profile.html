<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Professor Profile</title>
</head>
<body>
    <h2>Edit Profile</h2>

    <div th:if="${param.success}" style="color: green;">
        Profile updated successfully!
    </div>

    <form th:action="@{/professor/{id}/profile/edit(id=${professor.id})}" th:object="${professor}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required />
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>

        <div>
            <label for="researchFields">Research Fields / Interests:</label><br/>
            <textarea id="researchFields" th:field="*{researchFields}" rows="5" cols="40"
                      placeholder="e.g., Distributed Systems, Machine Learning, Network Security"></textarea>
        </div>

        <br/>
        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
