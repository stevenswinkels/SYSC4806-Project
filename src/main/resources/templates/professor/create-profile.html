<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Professor Profile')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="container">
    <p><a th:href="@{/admin}">Back to administrator dashboard</a></p>
    <h2>Create Professor Profile</h2>

    <form th:action="@{/professor/create}" th:object="${professor}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required />
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>

        <div>
            <label for="researchFields">Research Fields / Interests:</label><br/>
            <textarea id="researchFields" th:field="*{researchFields}" rows="5" cols="40" 
                      placeholder="e.g., Distributed Systems, Machine Learning, Network Security"></textarea>
        </div>

        <br/>
        <button type="submit">Create Profile</button>
    </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
